version: "2"
cloud:
  organization: "thalestmm"
  project: "gowork"
  hostname: ""
servers: []
sql:
  - schema: "./repository/migrations"
    queries: "./repository/queries"
    engine: "postgresql"
    gen:
      go:
        emit_json_tags: true
        emit_empty_slices: true
        package: "repository"
        out: "repository"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "text"
            nullable: false
            go_type:
              type: "string"
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "jsonb"
            nullable: false
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
              pointer: true
          - db_type: "int8"
            nullable: false
            go_type:
              type: "int64"
          - db_type: "int8"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "bigserial"
            nullable: false
            go_type:
              type: "int64"
          - db_type: "bigserial"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
plugins: []
rules: []
options: {}
