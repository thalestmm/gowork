name: gowork-environment
services:
  postgres:
    image: postgres:16-alpine
    container_name: gowork-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gowork
    ports:
      - "5432:5432"
    volumes:
      - gowork_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gowork"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  gowork_postgres_data:
